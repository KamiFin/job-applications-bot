# Job Applications Bot - Configuration
# Copy this file to config.yaml and fill in your details

# Path to your CV/resume file (PDF, DOCX, or TXT)
cv_path: "my_resume.pdf"

# Run browser in headless mode (no visible window)
# Set to false to watch the bot fill forms in real-time
headless: false

# Maximum number of applications per platform per run
max_applications: 10

# Job search parameters
search:
  query: "software engineer"
  location: "Remote"

# Platform configurations
platforms:
  linkedin:
    enabled: true
    credentials:
      email: "your-email@example.com"
      password: "your-password"

  indeed:
    enabled: false
    credentials:
      email: "your-email@example.com"
      password: "your-password"
